inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  sats-dev:
    url: github:satsenv/sats-dev?dir=src/modules
imports:
  - sats-dev/bitcoind.nix
  - sats-dev/lnd.nix
